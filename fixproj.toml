[general]
name = "regexp"
version = "2.1.0"
fix_version = "1.6.0"
description = "Provides regular expression matching."

[build]
files = [
    "regexp.fix",
    "internal/case_fold.fix",
    "internal/matches.fix",
    "internal/nfa.fix",
    "internal/pattern.fix",
